# Build via `cmake --build` so the same tasks work across every generator
# (Unix Makefiles on Linux/macOS, Visual Studio on Windows). The build
# directory is passed explicitly, and `--config` is honored by multi-config
# generators and ignored by single-config ones.

[tasks.cpp]
command = "cmake"
args = ["--build", "cmake.build", "--config", "Debug", "--target", "longportwhale_cpp"]

[tasks.cpp-release]
command = "cmake"
args = ["--build", "cmake.build", "--config", "Release", "--target", "longportwhale_cpp"]

[tasks.cpp-test]
command = "cmake"
args = ["--build", "cmake.build", "--config", "Debug", "--target", "test-cpp"]
